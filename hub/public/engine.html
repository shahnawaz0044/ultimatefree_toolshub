<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Ultimate Productivity Tools Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Free online tools for images, developers, business and daily life. No sign-up. Files never leave your device.">
<style>
:root{--bg:#f6f7fb;--card:rgba(255,255,255,.72);--bd:rgba(80,80,140,.16);--tx:#161a2e;--mut:#5c6280;--a:#4f6bff;--b:#9a5cff;--in:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f1c;--card:rgba(30,33,58,.62);--bd:rgba(150,160,255,.16);--tx:#eceefc;--mut:#9aa0c4;--in:#151831}}
:root[data-theme="dark"]{--bg:#0d0f1c;--card:rgba(30,33,58,.62);--bd:rgba(150,160,255,.16);--tx:#eceefc;--mut:#9aa0c4;--in:#151831}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Segoe UI",system-ui,sans-serif;background-image:radial-gradient(900px 400px at 15% -5%,rgba(79,107,255,.2),transparent),radial-gradient(700px 400px at 90% 0,rgba(154,92,255,.18),transparent);background-repeat:no-repeat}
a{color:inherit}header,main,footer{max-width:1080px;margin:auto;padding:0 18px}
header{display:flex;align-items:center;justify-content:space-between;padding-top:16px;padding-bottom:16px}
.logo{font-weight:800;font-size:18px;cursor:pointer;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
button,select,input,textarea{font:inherit;color:var(--tx)}
.btn{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:linear-gradient(90deg,var(--a),var(--b));color:#fff;font-weight:600}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tool:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.hero{padding:44px 0 24px;max-width:760px}
h1{font-size:clamp(30px,5.5vw,52px);line-height:1.08;margin:0 0 14px;letter-spacing:-.02em}
.hero p{color:var(--mut);font-size:18px;margin:0 0 22px}
.search{width:100%;padding:15px 18px;border-radius:14px;border:1px solid var(--bd);background:var(--in);font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 26px}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:14px}
.chip.on{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tool{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:16px;padding:16px;cursor:pointer;transition:transform .15s,border-color .15s}
.tool:hover{transform:translateY(-2px);border-color:var(--a)}
.tool b{display:block}.tool span{color:var(--mut);font-size:14px}.tool small{color:var(--a);font-weight:600}
.panel{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:18px;padding:20px;margin:14px 0}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--in)}
textarea{min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:12px}.row>*{flex:1 1 180px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.err{color:#e5484d;margin-top:10px}.ok{color:#2fa36b}
.drop{border:2px dashed var(--bd);border-radius:14px;padding:30px;text-align:center;cursor:pointer;color:var(--mut)}
.drop.hv{border-color:var(--a)}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.imgs>div{border:1px solid var(--bd);border-radius:12px;padding:10px;font-size:13px}.imgs img{width:100%;border-radius:8px;display:block;margin-bottom:6px}
.res{font-size:26px;font-weight:700;margin-top:12px}
.crumb{color:var(--mut);cursor:pointer;margin:6px 0}
h2{margin:30px 0 8px}details{border-bottom:1px solid var(--bd);padding:10px 0}summary{cursor:pointer;font-weight:600}
footer{color:var(--mut);font-size:14px;padding-top:34px;padding-bottom:40px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="logo" id="home">Tools Hub</div><button class="btn ghost" id="theme" aria-label="Toggle theme">Light / Dark</button></header>
<main id="app"></main>
<footer>Every tool runs in your browser. Your files and text are never uploaded. No account, no limits.</footer>
<script>
const EMB=location.search.includes('embed');
const $=(s,r=document)=>r.querySelector(s),el=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=[];const CATS=['Image','PDF','Text','Audio','Developer','Marketing','Business','Daily Life'];
function dl(name,data,type){try{parent.postMessage({type:'download',id:location.hash.slice(1)},location.origin)}catch(e){}const a=document.createElement('a');a.href=data instanceof Blob||typeof data!=='string'?URL.createObjectURL(new Blob([data],{type})):URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
/* text-in/text-out tool factory */
function text(id,cat,name,desc,{opts=[],fn,ph='Paste or type here…',ext='txt',noInput=false}){T.push({id,cat,name,desc,render(box){
 box.innerHTML=`<div class="panel">${noInput?'':`<label>Input</label><textarea id="in" placeholder="${ph}"></textarea>`}<div class="row">${opts.map(o=>`<div><label>${o.l}</label>${o.t==='num'?`<input type="number" id="o_${o.k}" value="${o.v}">`:`<select id="o_${o.k}">${o.vals.map(v=>`<option>${v}</option>`).join('')}</select>`}</div>`).join('')}</div>
 <div class="acts"><button class="btn" id="run">${noInput?'Generate':'Run'}</button><button class="btn ghost" id="cp">Copy</button><button class="btn ghost" id="sv">Download</button></div><div id="msg"></div><label>Result</label><textarea id="out" readonly></textarea></div>`;
 const run=()=>{$('#msg',box).innerHTML='';try{const o={};opts.forEach(x=>o[x.k]=$('#o_'+x.k,box).value);$('#out',box).value=fn(noInput?'':$('#in',box).value,o)}catch(e){$('#msg',box).innerHTML=`<div class="err">${esc(e.message)}</div>`}};
 $('#run',box).onclick=run;$('#cp',box).onclick=()=>navigator.clipboard.writeText($('#out',box).value).then(()=>$('#msg',box).innerHTML='<div class="ok">Copied.</div>');
 $('#sv',box).onclick=()=>$('#out',box).value?dl(id+'.'+ext,$('#out',box).value,'text/plain'):0;if(noInput)run()}})}
/* calculator factory */
function calc(id,cat,name,desc,fields,fn){T.push({id,cat,name,desc,render(box){
 box.innerHTML=`<div class="panel"><div class="row">${fields.map(f=>`<div><label>${f.l}</label>${f.vals?`<select id="f_${f.k}">${f.vals.map(v=>`<option>${v}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'number'}" value="${f.v??''}" step="any">`}</div>`).join('')}</div><div class="acts"><button class="btn" id="run">Calculate</button></div><div class="res" id="res"></div></div>`;
 $('#run',box).onclick=()=>{const v={};fields.forEach(f=>v[f.k]=$('#f_'+f.k,box).value);try{$('#res',box).innerHTML=fn(v)}catch(e){$('#res',box).innerHTML=`<span class="err">${esc(e.message)}</span>`}}}})}
/* ---------- Developer ---------- */
text('json-formatter','Developer','JSON Formatter & Validator','Format, minify and validate JSON.',{opts:[{k:'m',l:'Mode',vals:['Format (2 spaces)','Format (4 spaces)','Minify']}],ext:'json',fn:(s,o)=>{const j=JSON.parse(s);return o.m==='Minify'?JSON.stringify(j):JSON.stringify(j,null,o.m.includes('4')?4:2)}});
text('base64','Developer','Base64 Encoder / Decoder','Encode or decode text as Base64, Unicode-safe.',{opts:[{k:'m',l:'Direction',vals:['Encode','Decode']}],fn:(s,o)=>o.m==='Encode'?btoa(String.fromCharCode(...new TextEncoder().encode(s))):new TextDecoder().decode(Uint8Array.from(atob(s.trim()),c=>c.charCodeAt(0)))});
text('url-coder','Developer','URL Encoder / Decoder','Percent-encode or decode URLs and query strings.',{opts:[{k:'m',l:'Direction',vals:['Encode','Decode']}],fn:(s,o)=>o.m==='Encode'?encodeURIComponent(s):decodeURIComponent(s)});
text('jwt','Developer','JWT Decoder','Read the header and payload of a JSON Web Token. The signature is not verified.',{ph:'eyJhbGciOi…',fn:s=>{const p=s.trim().split('.');if(p.length<2)throw Error('A JWT has three dot-separated parts.');const d=x=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(x.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))));const pl=d(p[1]);let r='HEADER\n'+JSON.stringify(d(p[0]),null,2)+'\n\nPAYLOAD\n'+JSON.stringify(pl,null,2);if(pl.exp)r+='\n\nExpires: '+new Date(pl.exp*1e3).toString();return r}});
text('uuid','Developer','UUID Generator','Generate random v4 UUIDs.',{noInput:true,opts:[{k:'n',l:'How many',t:'num',v:5}],fn:(_,o)=>Array.from({length:Math.min(500,+o.n||1)},()=>crypto.randomUUID()).join('\n')});
text('regex','Developer','Regex Tester','List every match of a pattern in your text. Pattern goes on the first line, text below.',{ph:'\\b\\w+@\\w+\\.com\\b\nContact a@b.com or c@d.com',opts:[{k:'f',l:'Flags',vals:['g','gi','gm','gs']}],fn:(s,o)=>{const i=s.indexOf('\n'),p=s.slice(0,i<0?s.length:i),t=i<0?'':s.slice(i+1);const m=[...t.matchAll(new RegExp(p,o.f))];return m.length?m.length+' match(es)\n\n'+m.map((x,n)=>`${n+1}. "${x[0]}" at ${x.index}`).join('\n'):'No matches.'}});
text('hash','Developer','Hash Generator','SHA-1, SHA-256, SHA-512 of any text.',{opts:[{k:'a',l:'Algorithm',vals:['SHA-256','SHA-1','SHA-512']}],fn:null});
T[T.length-1].render=function(box){box.innerHTML=`<div class="panel"><label>Input</label><textarea id="in"></textarea><label>Algorithm</label><select id="a"><option>SHA-256</option><option>SHA-1</option><option>SHA-512</option></select><div class="acts"><button class="btn" id="run">Hash</button></div><label>Result</label><textarea id="out" readonly></textarea></div>`;$('#run',box).onclick=async()=>{const h=await crypto.subtle.digest($('#a',box).value,new TextEncoder().encode($('#in',box).value));$('#out',box).value=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}};
text('password','Developer','Password Generator','Strong random passwords from your browser\'s secure random source.',{noInput:true,opts:[{k:'n',l:'Length',t:'num',v:16},{k:'c',l:'Count',t:'num',v:5},{k:'s',l:'Symbols',vals:['Include','Exclude']}],fn:(_,o)=>{const cs='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'+(o.s==='Include'?'!@#$%^&*()-_=+[]{}?':'');const L=Math.min(128,Math.max(4,+o.n));return Array.from({length:Math.min(50,+o.c||1)},()=>Array.from(crypto.getRandomValues(new Uint32Array(L)),x=>cs[x%cs.length]).join('')).join('\n')}});
/* ---------- Marketing ---------- */
text('keyword-density','Marketing','Keyword Density Checker','Find the most-used words and phrases in your copy.',{opts:[{k:'n',l:'Phrase length',vals:['1','2','3']}],fn:(s,o)=>{const w=s.toLowerCase().match(/[a-z0-9'’-]+/g)||[];if(!w.length)throw Error('Add some text first.');const n=+o.n,m={};for(let i=0;i+n<=w.length;i++){const k=w.slice(i,i+n).join(' ');m[k]=(m[k]||0)+1}return w.length+' words\n\n'+Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,25).map(([k,v])=>`${k.padEnd(28)} ${v}  (${(v/w.length*100).toFixed(1)}%)`).join('\n')}});
text('robots','Marketing','Robots.txt Generator','Build a robots.txt file.',{noInput:true,ext:'txt',opts:[{k:'a',l:'Default access',vals:['Allow all','Block all']},{k:'d',l:'Disallow path',t:'num',v:''},{k:'s',l:'Sitemap URL',t:'num',v:''}],fn:null});
T[T.length-1].render=function(box){box.innerHTML=`<div class="panel"><label>Default access</label><select id="a"><option>Allow all</option><option>Block all</option></select><label>Disallow paths (comma separated)</label><input type="text" id="d" placeholder="/admin, /private"><label>Sitemap URL</label><input type="text" id="s" placeholder="https://example.com/sitemap.xml"><div class="acts"><button class="btn" id="run">Generate</button><button class="btn ghost" id="sv">Download</button></div><label>Result</label><textarea id="out" readonly></textarea></div>`;$('#run',box).onclick=()=>{let r='User-agent: *\n'+($('#a',box).value==='Block all'?'Disallow: /\n':'Allow: /\n');$('#d',box).value.split(',').map(x=>x.trim()).filter(Boolean).forEach(p=>r+='Disallow: '+p+'\n');if($('#s',box).value)r+='\nSitemap: '+$('#s',box).value;$('#out',box).value=r};$('#sv',box).onclick=()=>dl('robots.txt',$('#out',box).value,'text/plain');$('#run',box).click()};
text('meta-preview','Marketing','Meta Tag Generator','Turn a title and description into ready-to-paste HTML meta tags. Title on line 1, description on line 2, URL on line 3.',{ext:'html',ph:'My Page Title\nA short description under 160 characters.\nhttps://example.com/page',fn:s=>{const[l1='',l2='',l3='']=s.split('\n');let r='';if(l1.length>60)r+=`<!-- Title is ${l1.length} chars; aim for 60 or fewer -->\n`;if(l2.length>160)r+=`<!-- Description is ${l2.length} chars; aim for 160 or fewer -->\n`;return r+`<title>${esc(l1)}</title>\n<meta name="description" content="${esc(l2)}">\n<meta property="og:title" content="${esc(l1)}">\n<meta property="og:description" content="${esc(l2)}">\n`+(l3?`<link rel="canonical" href="${esc(l3)}">\n<meta property="og:url" content="${esc(l3)}">`:'')}});
text('hashtags','Marketing','Hashtag Generator','Turn keywords (one per line or comma-separated) into hashtags.',{fn:s=>{const t=s.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean).map(x=>'#'+x.replace(/[^\p{L}\p{N} ]/gu,'').split(/\s+/).map((w,i)=>w[0].toUpperCase()+w.slice(1)).join(''));if(!t.length)throw Error('Add at least one keyword.');return t.join(' ')}});
/* ---------- Business / finance ---------- */
calc('loan','Business','Loan Calculator','Monthly payment, total interest and total cost.',[{k:'p',l:'Loan amount',v:10000},{k:'r',l:'Annual interest %',v:8},{k:'y',l:'Term in years',v:3}],v=>{const P=+v.p,r=v.r/1200,n=v.y*12,m=r?P*r/(1-Math.pow(1+r,-n)):P/n,t=m*n;return`${m.toFixed(2)} / month<br><small style="font-size:15px;font-weight:400">Total paid ${t.toFixed(2)} · Interest ${(t-P).toFixed(2)}</small>`});
calc('roi','Business','ROI Calculator','Return on investment and profit.',[{k:'c',l:'Amount invested',v:5000},{k:'r',l:'Final value',v:6500}],v=>{if(+v.c<=0)throw Error('Investment must be above 0.');const p=v.r-v.c;return`${(p/v.c*100).toFixed(2)}% ROI<br><small style="font-size:15px;font-weight:400">Profit ${p.toFixed(2)}</small>`});
calc('profit','Business','Profit Margin Calculator','Profit, margin and markup from cost and price.',[{k:'c',l:'Cost',v:60},{k:'p',l:'Selling price',v:100}],v=>{const g=v.p-v.c;return`${(g/v.p*100).toFixed(1)}% margin<br><small style="font-size:15px;font-weight:400">Profit ${g.toFixed(2)} · Markup ${(g/v.c*100).toFixed(1)}%</small>`});
T.push({id:'invoice',cat:'Business',name:'Invoice Generator',desc:'Fill in the details, then save or print as PDF.',render(box){
 box.innerHTML=`<div class="panel"><div class="row"><div><label>From</label><input type="text" id="fr" value="Your Business"></div><div><label>Bill to</label><input type="text" id="to" value="Client Name"></div><div><label>Invoice #</label><input type="text" id="no" value="INV-001"></div><div><label>Tax %</label><input type="number" id="tx" value="0"></div></div><label>Line items (description, qty, unit price per line)</label><textarea id="li">Design work, 10, 50\nHosting, 1, 120</textarea><div class="acts"><button class="btn" id="run">Build invoice</button><button class="btn ghost" id="pr">Print / Save PDF</button></div><div id="pv"></div></div>`;
 $('#run',box).onclick=()=>{let s=0;const rows=$('#li',box).value.split('\n').filter(Boolean).map(l=>{const[d,q,p]=l.split(',').map(x=>x.trim());const t=(+q||0)*(+p||0);s+=t;return`<tr><td>${esc(d)}</td><td>${+q||0}</td><td>${(+p||0).toFixed(2)}</td><td>${t.toFixed(2)}</td></tr>`}).join('');const tax=s*$('#tx',box).value/100;
 $('#pv',box).innerHTML=`<div id="inv" style="background:#fff;color:#111;padding:22px;border-radius:12px;margin-top:16px"><h2 style="margin:0">Invoice ${esc($('#no',box).value)}</h2><p>From: ${esc($('#fr',box).value)}<br>To: ${esc($('#to',box).value)}<br>Date: ${new Date().toLocaleDateString()}</p><table style="width:100%;border-collapse:collapse" border="1" cellpadding="6"><tr><th align="left">Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>${rows}</table><p align="right">Subtotal ${s.toFixed(2)}<br>Tax ${tax.toFixed(2)}<br><b>Total ${(s+tax).toFixed(2)}</b></p></div>`};
 $('#pr',box).onclick=()=>{$('#run',box).click();const w=open('','_blank');w.document.write('<title>Invoice</title>'+$('#inv',box).outerHTML);w.print()};$('#run',box).click()}});
/* ---------- Daily life ---------- */
calc('bmi','Daily Life','BMI Calculator','Body mass index from weight and height.',[{k:'w',l:'Weight (kg)',v:70},{k:'h',l:'Height (cm)',v:170}],v=>{const b=v.w/Math.pow(v.h/100,2);return`BMI ${b.toFixed(1)}<br><small style="font-size:15px;font-weight:400">${b<18.5?'Underweight':b<25?'Healthy range':b<30?'Overweight':'Obese'} (general guide, not medical advice)</small>`});
calc('age','Daily Life','Age Calculator','Exact age in years, months and days.',[{k:'d',l:'Date of birth',t:'date',v:'1995-01-01'}],v=>{const b=new Date(v.d),n=new Date();if(isNaN(b)||b>n)throw Error('Enter a valid past date.');let y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth(),d=n.getDate()-b.getDate();if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}return`${y} years, ${m} months, ${d} days<br><small style="font-size:15px;font-weight:400">${Math.floor((n-b)/864e5).toLocaleString()} days lived</small>`});
const U={Length:{m:1,km:1e3,cm:.01,mm:.001,mi:1609.344,ft:.3048,in:.0254,yd:.9144},Weight:{kg:1,g:.001,lb:.45359237,oz:.0283495,t:1e3},Data:{B:1,KB:1024,MB:1048576,GB:1073741824,TB:1099511627776},Time:{s:1,min:60,h:3600,day:86400,week:604800}};
calc('units','Daily Life','Unit Converter','Length, weight, data size and time.',[{k:'c',l:'Type',vals:Object.keys(U)},{k:'v',l:'Value',v:1},{k:'f',l:'From (unit)',t:'text',v:'km'},{k:'t',l:'To (unit)',t:'text',v:'mi'}],v=>{const u=U[v.c];if(!u[v.f]||!u[v.t])throw Error('Units for '+v.c+': '+Object.keys(u).join(', '));return(v.v*u[v.f]/u[v.t]).toLocaleString(undefined,{maximumFractionDigits:6})+' '+v.t});
calc('color','Daily Life','Color Converter','HEX to RGB and HSL.',[{k:'h',l:'HEX color',t:'text',v:'#4f6bff'}],v=>{let h=v.h.replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');if(!/^[0-9a-f]{6}$/i.test(h))throw Error('Use a 3 or 6 digit HEX value.');const[r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)),x=Math.max(r,g,b)/255,n=Math.min(r,g,b)/255,l=(x+n)/2,d=x-n,s=d?d/(1-Math.abs(2*l-1)):0;let H=d?x===r/255?((g-b)/255/d)%6:x===g/255?(b-r)/255/d+2:(r-g)/255/d+4:0;H=Math.round((H*60+360)%360);return`<span style="display:inline-block;width:26px;height:26px;border-radius:6px;background:#${h};vertical-align:middle"></span> rgb(${r}, ${g}, ${b})<br><small style="font-size:15px;font-weight:400">hsl(${H}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)</small>`});
text('case','Daily Life','Text Case & Word Counter','Count words and switch text case.',{opts:[{k:'m',l:'Case',vals:['UPPERCASE','lowercase','Title Case','Sentence case']}],fn:(s,o)=>{const w=(s.match(/\S+/g)||[]).length;const c={UPPERCASE:s.toUpperCase(),lowercase:s.toLowerCase(),'Title Case':s.toLowerCase().replace(/\b\w/g,x=>x.toUpperCase()),'Sentence case':s.toLowerCase().replace(/(^\s*|[.!?]\s+)(\w)/g,(_,a,b)=>a+b.toUpperCase())}[o.m];return`/* ${w} words, ${s.length} characters */\n`+c}});
/* ---------- Audio ---------- */
T.push({id:'tts',cat:'Audio',name:'Text To Speech',desc:'Speak text aloud with your device\'s voices. Choose language, speed and pitch.',render(box){
 box.innerHTML=`<div class="panel"><label>Text</label><textarea id="in">Hello! This is text to speech running in your browser.</textarea><div class="row"><div><label>Voice</label><select id="v"></select></div><div><label>Speed <span id="rv">1</span></label><input type="range" id="r" min=".5" max="2" step=".1" value="1"></div><div><label>Pitch <span id="pv">1</span></label><input type="range" id="p" min="0" max="2" step=".1" value="1"></div></div><div class="acts"><button class="btn" id="run">Speak</button><button class="btn ghost" id="st">Stop</button></div><p class="ok" style="color:var(--mut);font-size:14px">Voices depend on your device. Audio file export isn't available in browsers for this feature.</p></div>`;

calc('datediff','Daily Life','Date Calculator','Days, weeks and months between two dates.',[{k:'a',l:'From',t:'date',v:new Date().toISOString().slice(0,10)},{k:'b',l:'To',t:'date',v:'2027-01-01'}],v=>{const a=new Date(v.a),b=new Date(v.b);if(isNaN(a)||isNaN(b))throw Error('Enter both dates.');const d=Math.round((b-a)/864e5);return`${d} days<br><small style="font-size:15px;font-weight:400">${(d/7).toFixed(1)} weeks · about ${(d/30.44).toFixed(1)} months</small>`});
const TZ=(Intl.supportedValuesOf?Intl.supportedValuesOf('timeZone'):['UTC']),myTz=Intl.DateTimeFormat().resolvedOptions().timeZone,tzl=[myTz,...TZ.filter(z=>z!==myTz)];
const tzOff=(tz,d)=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(d).map(x=>[x.type,x.value]));return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-d.getTime()};
calc('timezone','Daily Life','Time Zone Converter','Convert a date and time between any two time zones.',[{k:'d',l:'Date and time',t:'datetime-local',v:new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16)},{k:'f',l:'From zone',vals:tzl},{k:'t',l:'To zone',vals:tzl}],v=>{if(!v.d)throw Error('Enter a date and time.');const u=Date.parse(v.d+':00Z'),g=u-tzOff(v.f,new Date(u));return new Intl.DateTimeFormat('en-GB',{timeZone:v.t,dateStyle:'full',timeStyle:'short'}).format(g)});

/* ---------- Router / UI ---------- */
const app=$('#app');let cat='All';
const FAQ=[['Do my files get uploaded?','No. Every tool runs inside your browser, so files and text stay on your device.'],['Do I need an account?','No account, no limits and no payment.'],['Do any tools need the internet?','PDF and QR tools load a small helper library the first time you use them. Everything else works offline after the page loads.']];
function home(q=''){app.innerHTML=`<section class="hero"><h1>Free online tools that run on your device</h1><p>Convert images, format code, run calculations and write faster. No sign-up, and your files never leave your browser.</p><input class="search" id="s" type="search" placeholder="Search ${T.length} tools" aria-label="Search tools" value="${esc(q)}"></section><div class="chips" id="ch"></div><div class="grid" id="g"></div><h2>Questions</h2>${FAQ.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}`;
 $('#ch').innerHTML=['All',...CATS].map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${c}">${c}</button>`).join('');
 const draw=()=>{const s=$('#s').value.toLowerCase();const l=T.filter(t=>(cat==='All'||t.cat===cat)&&(t.name+t.desc+t.cat).toLowerCase().includes(s));$('#g').innerHTML=l.length?l.map(t=>`<div class="tool" tabindex="0" role="link" data-id="${t.id}"><small>${t.cat}</small><b>${t.name}</b><span>${t.desc}</span></div>`).join(''):'<p>No tools match. Try a shorter search or pick All.</p>'};
 $('#s').oninput=draw;$('#ch').onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;$$('.chip').forEach(c=>c.classList.toggle('on',c.dataset.c===cat));draw()}};
 $('#g').onclick=e=>{const t=e.target.closest('.tool');if(t)location.hash=t.dataset.id};$('#g').onkeydown=e=>{if(e.key==='Enter'&&e.target.dataset.id)location.hash=e.target.dataset.id};draw()}
const $$=s=>[...document.querySelectorAll(s)];
function open_(id){const t=T.find(x=>x.id===id);if(!t)return home();document.title=t.name+' – Tools Hub';app.innerHTML=`<div class="crumb" id="bk">← All tools</div><h1 style="font-size:clamp(26px,4vw,38px)">${t.name}</h1><p style="color:var(--mut)">${t.desc}</p><div id="box"></div><h2>Related tools</h2><div class="grid" id="rel"></div>`;$('#bk').onclick=()=>location.hash='';t.render($('#box'));if(EMB){['header','footer'].forEach(q=>document.querySelector(q).style.display='none');$('#bk').style.display='none';app.querySelector('h1').style.display='none';app.querySelector('h1+p').style.display='none';$('#rel').style.display='none';$('#rel').previousElementSibling.style.display='none';document.body.style.background='transparent';document.body.style.backgroundImage='none'}
 $('#rel').innerHTML=T.filter(x=>x.cat===t.cat&&x.id!==id).slice(0,3).map(x=>`<div class="tool" tabindex="0" data-id="${x.id}"><b>${x.name}</b><span>${x.desc}</span></div>`).join('');$('#rel').onclick=e=>{const c=e.target.closest('.tool');if(c)location.hash=c.dataset.id};scrollTo(0,0)}
function route(){const id=location.hash.slice(1);document.title='Ultimate Productivity Tools Hub';id?open_(id):home()}
addEventListener('hashchange',route);$('#home').onclick=()=>location.hash='';
$('#theme').onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue('--bg').trim()==='#0d0f1c';d.dataset.theme=dark?'light':'dark'};
if(EMB){const q=new URLSearchParams(location.search).get('theme');if(q)document.documentElement.dataset.theme=q;addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&e.data.type==='theme')document.documentElement.dataset.theme=e.data.v});
 new ResizeObserver(()=>parent.postMessage({type:'height',h:document.documentElement.scrollHeight},location.origin)).observe(document.body);
 document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#run'))parent.postMessage({type:'used',id:location.hash.slice(1)},location.origin)})}
route();
</script></body></html>
